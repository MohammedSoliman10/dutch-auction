# T001 — toolchain pinned (Constitution: solc + optimizer + EVM version fixed, changed only via PR)
# Pinned deps (Constitution IV, exact-commit):
#   openzeppelin-contracts: tag v5.7.0 @ cab19933c33c2ad1d4c7a84864a3601dddfd16f3
#   forge-std: see .gitmodules for exact commit
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.31"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# vm.writeJson (Deploy.s.sol → deployments/<network>.json)
fs_permissions = [{ access = "read-write", path = "./" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"

[lint]
# block-timestamp is inherent to this domain: a time-based auction MUST compare
# `block.timestamp` against expiry; ±validator timestamp drift is immaterial at
# a >= 60 s auction granularity.
exclude_lints = ["block-timestamp"]
